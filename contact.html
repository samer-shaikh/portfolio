<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | Let's Collaborate</title>
     <link rel="icon" type="image/png" href="images/project0.png">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>
    <nav class="navbar scrolled" id="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">PORTFOLIO.</a>
            <button class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-links" id="nav-links">
                <div class="sidebar-close" id="sidebar-close">&times;</div>
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="projects.html" class="nav-link">Projects</a></li>
                <li><a href="contact.html" class="nav-link active">Contact</a></li>
            </ul>
        </div>
    </nav>
    <div class="nav-overlay" id="nav-overlay"></div>

    <main class="section-padding" style="margin-top: 80px;">
        <div class="container">
            <div class="contact-container">
                <header style="text-align: center; margin-bottom: 50px;">
                    <h1 class="reveal-char observe-scroll">Get In Touch</h1>
                    <p class="blur-reveal observe-scroll stagger-2">Have a project in mind? Shoot me a message and let's turn your ideas into reality.</p>
                </header>

                <form 
                    name="contact" 
                    method="POST" 
                    data-netlify="true"
                    class="contact-form blur-reveal observe-scroll"
                    id="contact-form"
                >

                    <!-- Hidden input required for Netlify -->
                    <input type="hidden" name="form-name" value="contact">

                    <div class="form-group stagger-1">
                        <label for="name">Name</label>
                        <input 
                            type="text" 
                            id="name" 
                            name="name" 
                            class="form-control" 
                            placeholder="Your full name" 
                            required
                        >
                    </div>

                    <div class="form-group stagger-2">
                        <label for="email">Email</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-control" 
                            placeholder="your@email.com" 
                            required
                        >
                    </div>

                    <div class="form-group stagger-3">
                        <label for="message">Message</label>
                        <textarea 
                            id="message" 
                            name="message" 
                            class="form-control" 
                            rows="5" 
                            placeholder="Tell me about your project..." 
                            required
                        ></textarea>
                    </div>

                    <button 
                        type="submit" 
                        class="btn" 
                        style="width: 100%;"
                    >
                        Send Message
                    </button>

                </form>

                <div style="margin-top: 60px; text-align: center;" class="blur-reveal observe-scroll stagger-4">
                    <p style="font-weight: 600; margin-bottom: 10px;">Alternatively, reach out at:</p>
                    <a href="mailto:hello@devportfolio.com" style="font-size: 1.2rem; color: var(--text-muted);">hello@serverflow.agency</a>
                    
                    <div style="margin-top: 30px; display: flex; justify-content: center; gap: 20px;">
                        <a href="https://www.linkedin.com/company/117044696" class="nav-link">LinkedIn</a>
                        <a href="https://github.com/samer-shaikh" class="nav-link">GitHub</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="projects.html">Projects</a>
                <a href="contact.html">Contact</a>
            </div>
            <p>&copy; 2024 DevPortfolio. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/contact.js"></script>
</body>
</html>
